---

# Actualiza la caché de paquetes apt.
- name: Actualizar cache de apt
  apt:
    update_cache: true
    cache_valid_time: 3600

# Instala dependencias necesarias para añadir repositorios HTTPS.
- name: Instalar dependencias para Docker
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present

# Crea el directorio donde se almacenará la clave de Docker.
- name: Crear directorio para keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# Descarga la clave GPG oficial de Docker.
- name: Descargar clave GPG de Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# Añade el repositorio oficial de Docker para Ubuntu.
- name: Añadir repositorio oficial de Docker
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

# Instala Docker Engine y sus componentes principales.
- name: Instalar Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

# Asegura que el servicio Docker esté iniciado y habilitado al arrancar.
- name: Iniciar y habilitar Docker
  service:
    name: docker
    state: started
    enabled: true
