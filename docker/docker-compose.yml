services:
  # Base de datos de WordPress.
  mariadb:
    image: mariadb:11
    container_name: cloud1_mariadb
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

    # Guarda los datos de MariaDB de forma persistente.
    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - cloud1_network

  # Aplicación WordPress conectada a MariaDB.
  wordpress:
    image: wordpress:latest
    container_name: cloud1_wordpress

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$s=@fsockopen(\"127.0.0.1\",80); if (!$$s) exit(1); fclose($$s);'"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}

    depends_on:
      mariadb:
        condition: service_healthy

    # Guarda los archivos de WordPress de forma persistente.
    volumes:
      - wordpress_data:/var/www/html

    networks:
      - cloud1_network

  # Herramienta de línea de comandos para configurar WordPress.
  wordpress-cli:
    image: wordpress:cli
    container_name: cloud1_wordpress_cli
    user: "33:33"

    depends_on:
      - mariadb
      - wordpress

    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - cloud1_network

    profiles:
      - cli

  # Interfaz web para administrar MariaDB.
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cloud1_phpmyadmin

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$s=@fsockopen(\"127.0.0.1\",80); if (!$$s) exit(1); fclose($$s);'"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306

    depends_on:
      mariadb:
        condition: service_healthy

    networks:
      - cloud1_network

  # Exporta métricas Prometheus de los contenedores solo dentro de la VM.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cloud1_cadvisor
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

    networks:
      - cloud1_network

  # Proxy inverso que expone la aplicación al exterior.
  nginx:
    image: nginx:latest
    container_name: cloud1_nginx

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    depends_on:
      wordpress:
        condition: service_healthy
      phpmyadmin:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

    networks:
      - cloud1_network

# Volumen persistente para la base de datos.
volumes:
  mariadb_data:
  wordpress_data:

# Red privada que utilizarán los servicios de Cloud-1.
networks:
  cloud1_network:
    driver: bridge
